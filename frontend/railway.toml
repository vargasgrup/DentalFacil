[build]
builder = "DOCKERFILE"
# Prefer root Dockerfile so BACKEND_URL build-arg and monorepo COPY paths stay consistent.
dockerfilePath = "Dockerfile.frontend"
watchPatterns = [
  "/frontend/**",
  "frontend/**",
  "/Dockerfile.frontend",
  "Dockerfile.frontend",
  "/frontend/railway.toml",
  "frontend/railway.toml",
]

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
