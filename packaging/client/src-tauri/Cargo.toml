[package]
name = "nkdentalsoft-client"
version = "1.0.0"
description = "N&K DentalSoft — cliente LAN (Tauri WebView)"
authors = ["N&K Systemas SAC"]
edition = "2021"

[lib]
name = "nkdentalsoft_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
url = "2"
# Optional mDNS browse — enable on the Windows build PC:
# mdns-sd = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
