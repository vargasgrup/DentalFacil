[build]
builder = "DOCKERFILE"
# Build context = repository root (Root Directory empty in Railway UI).
dockerfilePath = "Dockerfile.backend"
# Match both absolute and relative patterns (Railway UI root-dir variants).
watchPatterns = [
  "/backend/**",
  "backend/**",
  "/Dockerfile.backend",
  "Dockerfile.backend",
  "/backend/railway.toml",
  "backend/railway.toml",
]

[deploy]
startCommand = "python boot.py"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Keep a single replica. If using SQLite+/data volume: Settings → Replicas = 1.
# Preferred production DB: Postgres service → DATABASE_URL=${{Postgres.DATABASE_URL}}
# See docs/RAILWAY.md (fix for "0 Variables" / sqlite+development drift).
