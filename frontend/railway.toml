[build]
builder = "DOCKERFILE"
# IMPORTANT: Railway Frontend service uses Root Directory = `frontend`
# (build context = contents of frontend/). Use this Dockerfile, NOT
# Dockerfile.frontend (that one expects repo-root context + COPY frontend/).
dockerfilePath = "frontend/Dockerfile"
# Frontend Railway service (Root Directory = frontend).
# Bump: social share OG image + brand favicons (2026-07-31).
watchPatterns = [
  "/frontend/**",
  "frontend/**",
  "/frontend/Dockerfile",
  "frontend/Dockerfile",
  "/frontend/railway.toml",
  "frontend/railway.toml",
]

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
